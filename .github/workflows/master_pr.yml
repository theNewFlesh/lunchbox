# Please ensure the following GitHub repository action secrets are set up:
#  - DOCKER_REGISTRY_USER
#  - DOCKER_REGISTRY_PASSWORD

name: Master Pull Request
run-name: "${{ github.event.head_commit.message }} | PR: ${{ github.base_ref }} --> master | ${{ github.actor }}"

on:
  push:

env:
  repo: "${{ github.event.repository.name }}"
  cli: "bin/${{ github.event.repository.name }}"
  org: "thenewflesh"
  org_url: "github.com"
  docker_registry: "docker.io"

jobs:
  event-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      abort: ${{ steps.event-check.outputs.abort }}
    steps:
      - name: Check CI Event
        if: github.ref_name != 'master' && github.event_name == 'push'
        id: event-check
        run: |
          pr_branches=$(gh pr list --json headRefName --repo "$GITHUB_REPOSITORY")
          if [[ $(echo "$pr_branches" | jq -r --arg ref_name "$GITHUB_REF_NAME" '.[] | select(.headRefName == $ref_name)') ]]; then
            echo "This push is associated with a pull request."
            echo "abort=false" >> $GITHUB_OUTPUT
          fi

  master-pr:
    runs-on: ubuntu-latest
    needs: event-check
    if: needs.event-check.outputs.abort != 'true'
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Change repo permissions
        run: chmod -R o+w ../

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.docker_registry }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Pull image
        run: $($cli docker-pull-dev) || echo "docker image not found"

      - name: Build image
        run: $cli docker-build-from-cache

      - name: Start container
        run: $cli docker-start

      - name: Generate docs
        run: $cli docs

      - name: Generate code metrics
        run: $cli docs-metrics

      - name: Generate architecture diagram
        run: $cli docs-architecture

      - name: Lint code
        run: $cli test-lint

      - name: Run tests
        run: $cli test-coverage

