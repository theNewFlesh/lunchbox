name: Feature

on:
  push:
    branches: [ github-workflows ]

env:
  repo: "${{ github.event.repository.name }}"
  cli: "bin/${{ github.event.repository.name }}"
  org: "thenewflesh"
  org_url: "github.com"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

    #   - name: Docker Login
    #     run: docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY

      - name: Pull Image
        run: $($cli docker-pull-dev) || echo "docker image not found"

      - name: Build Image
        run: $cli docker-build-from-cache
